name: Test, build and deploy to Hostinger

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, gd, mbstring, fileinfo, openssl, pdo_mysql, pdo_sqlite

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check PHP syntax
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: API tests (SQLite, mock payments, fake mailbox)
        run: python3 api/tests/test_api.py

      - run: npm ci
      - run: npm run build

      - name: Browser tests (desktop, phones, offline and security checks)
        run: |
          npx playwright install --with-deps chromium
          node scripts/test-site.mjs
          node scripts/test-phone.mjs

      # Uploads the built site (dist/, including dist/api) to public_html on Hostinger.
      # Needs repository secrets FTP_SERVER, FTP_USERNAME and FTP_PASSWORD
      # (Hostinger hPanel → Files → FTP Accounts). Skipped until they are set. Only main is ever uploaded:
      # never a pull request, and never another branch started by hand with "Run workflow".
      - name: Upload to Hostinger over FTP
        if: env.FTP_SERVER != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            uploads/**
            api/config.php
